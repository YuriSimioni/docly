
services:
  mariadb:
    image: mariadb:11.4
    container_name: docly-mariadb
    restart: unless-stopped
    networks:
      - pma_network
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: docly
      MARIADB_USER: docly
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo

    ports:
      - "3306:3306"

    volumes:
      - docly_mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-03:00

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  docly_mariadb_data:
    name: docly_mariadb_data

networks:
  pma_network:
    external: true